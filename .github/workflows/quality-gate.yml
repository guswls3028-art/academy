name: Backend Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-quality-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-security-diff:
    name: Detect native security image changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect base-image security changes
        id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet \
            "${{ github.event.pull_request.base.sha }}"...HEAD -- \
            docker/Dockerfile.base docker/native-security/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  native-security-image:
    name: Native security arm64 image contract
    needs: native-security-diff
    if: needs.native-security-diff.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build patched Academy base image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.base
          platforms: linux/arm64
          load: true
          tags: academy-base:native-security-check
          build-args: APT_REFRESH_TOKEN=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=backend-native-security
          cache-to: type=gha,mode=max,scope=backend-native-security
          provenance: false
      - name: Verify fixed package versions and runtime ABI
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${GITHUB_WORKSPACE}/docker/native-security/verify-fixed-libs.sh:/tmp/verify-fixed-libs.sh:ro" \
            academy-base:native-security-check sh /tmp/verify-fixed-libs.sh

  static-contract:
    name: Backend static and migration contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install static tooling
        run: python -m pip install --disable-pip-version-check --quiet ruff
      - name: Ruff and architecture boundaries
        run: |
          python -m ruff check apps/ academy/
          python scripts/lint/check_submission_lifecycle_boundary.py
          python -m unittest scripts.lint.test_check_safe_method_writes
          python scripts/lint/check_safe_method_writes.py
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/lint/refactor_boundary_snapshot.py \
              --strict-touched \
              --base-ref "${{ github.event.pull_request.base.sha }}"
          else
            python scripts/lint/refactor_boundary_snapshot.py --strict-touched
          fi
          python scripts/lint/refactor_boundary_snapshot.py --enforce-baseline
      - name: Expand/contract migration boundary
        run: |
          python -m unittest scripts.lint.test_check_expand_contract_migrations
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            BASE_REF="HEAD^"
          fi
          ARGS=(--base-ref "$BASE_REF")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ARGS+=(--allow-contract-review)
          fi
          python scripts/lint/check_expand_contract_migrations.py "${ARGS[@]}"

  django-contract:
    name: Backend Django smoke and deployment contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/constraints.txt
            requirements/common.txt
            requirements/api.txt
            requirements/test.txt
      - name: Install application test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Django configuration and migrations
        env:
          DJANGO_SETTINGS_MODULE: apps.api.config.settings.test
        run: |
          python manage.py check --settings apps.api.config.settings.test
          python manage.py makemigrations --check --dry-run --settings apps.api.config.settings.test
      - name: OpenAPI generated contract drift
        run: python scripts/generate_openapi_schema.py --check
      - name: Smoke tests and coverage seed
        env:
          DJANGO_SETTINGS_MODULE: apps.api.config.settings.test
        run: |
          python -m coverage erase
          python -m coverage run --parallel-mode --source=apps,academy -m pytest tests/test_smoke.py tests/test_critical_academy_journey.py -v --tb=short -x
      - name: Full backend tests and coverage
        env:
          DJANGO_SETTINGS_MODULE: apps.api.config.settings.test
        run: |
          python -m coverage run --parallel-mode --source=apps,academy -m pytest -q --tb=short \
            apps/api apps/billing apps/core apps/shared apps/support apps/domains tests \
            --ignore=tests/test_smoke.py \
            --ignore=tests/test_critical_academy_journey.py
          python -m coverage combine
          python -m coverage report --fail-under=60.5 --skip-covered --show-missing
      - name: Deployment contract tests
        shell: pwsh
        run: |
          python -B -m unittest scripts.v1.test_frontend_development_qa -v
          if ($LASTEXITCODE -ne 0) { throw "Frontend development QA boundary contracts failed." }
          ./scripts/codex/test-change-risk-contract.ps1
          ./scripts/codex/test-production-release-bundle-contract.ps1
          ./scripts/v1/test-verification-contract.ps1
          ./scripts/v1/test-candidate-env-contract.ps1
          ./scripts/v1/test-aws-json-utf8-contract.ps1
          ./scripts/v1/test-production-source-freshness.ps1
          ./scripts/v1/test-rds-restore-drill-contract.ps1
          ./scripts/v1/test-workflow-governance-contract.ps1
          ./scripts/v1/test-product-analytics-operations-contract.ps1
      - name: Parse every deployment PowerShell script
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/v1,scripts/codex -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors) {
              $errors += $parseErrors | ForEach-Object {
                "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
            }
          }
          if ($errors) { throw ($errors -join [Environment]::NewLine) }
          Write-Host "POWERSHELL_PARSE_PASS"

  postgresql-contract:
    name: PostgreSQL transaction and tenant contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: apps.api.config.settings.test_pg
      TEST_DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/constraints.txt
            requirements/common.txt
            requirements/api.txt
            requirements/test.txt
      - name: Install application test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Verify isolated PostgreSQL boundary
        run: |
          python manage.py check --settings apps.api.config.settings.test_pg
          python - <<'PY'
          import django

          django.setup()

          from django.db import connection

          assert connection.vendor == "postgresql", connection.vendor
          with connection.cursor() as cursor:
              cursor.execute("SELECT current_database(), current_user")
              database_name, database_user = cursor.fetchone()
          assert database_name == "postgres", database_name
          assert database_user == "postgres", database_user
          PY
      - name: Full backend regression on PostgreSQL
        run: |
          python -m pytest -q --tb=short \
            apps/api apps/billing apps/core apps/shared apps/support apps/domains tests
