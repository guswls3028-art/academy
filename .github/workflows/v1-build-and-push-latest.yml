# ==============================================================================
# V1 ECR build/push + selective deploy — OIDC 전용. Access Key 미사용.
# Backend repo: guswls3028-art/academy-backend. SSOT: docs/infrastructure/deployment-architecture.md
# 6개 이미지 linux/arm64 immutable 후보 빌드·푸시. 검증 완료 후에만 latest 승격.
# V1.1.0: Zero-downtime deployment — SHA tagging, selective worker deploy,
#          pre-deploy migration, deploy verification.
# ==============================================================================

name: V1 Build and Push latest (OIDC)

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'README*'
      - 'docs/reports/**'
      - 'docs/ssot/runtime-current.md'
      - 'scripts/codex/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      allow_contract_migrations:
        description: "Allow an annotated contract migration after its expand release is fully deployed"
        required: true
        default: false
        type: boolean

concurrency:
  group: academy-production-mutation
  cancel-in-progress: false  # V1.1.0: prevent orphaned ASG refreshes on concurrent pushes

env:
  AWS_REGION: ap-northeast-2
  ACADEMY_DEPLOY_LOCK_TABLE: academy-v1-video-job-lock
  ACADEMY_DEPLOY_LOCK_OWNER: ci-deploy:${{ github.run_id }}:${{ github.run_attempt }}
  ECR_REGISTRY: 809466760795.dkr.ecr.ap-northeast-2.amazonaws.com
  ALB_DNS: academy-v1-api-alb-1244943981.ap-northeast-2.elb.amazonaws.com
  API_PUBLIC_URL: https://api.hakwonplus.com
  # A tag is never reused, including workflow reruns or a second manual run for
  # the same commit. ECR permits only `latest` to move.
  RELEASE_IMAGE_TAG: sha-${{ github.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
  # docker/build-push-action@v6 uploads a *.dockerbuild summary artifact per build
  # (separate from provenance/sbom). Disable to stop UI clutter — we already have
  # CloudWatch logs + ci-build-report for build observability.
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

permissions:
  contents: read

jobs:
  # ============================================================
  # Phase 1: Detect changes
  # ============================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      build_api: ${{ steps.changes.outputs.build_api }}
      build_video: ${{ steps.changes.outputs.build_video }}
      build_messaging: ${{ steps.changes.outputs.build_messaging }}
      build_ai: ${{ steps.changes.outputs.build_ai }}
      build_tools: ${{ steps.changes.outputs.build_tools }}
      build_base: ${{ steps.changes.outputs.build_base }}
      force_full: ${{ steps.changes.outputs.build_all }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set commit metadata
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT

      # A run can wait behind an earlier production mutation for a long time.
      # Capture the manifest promoted by that earlier run after the workflow-level
      # concurrency wait, rather than using the stale copy from this push SHA.
      - name: Capture current verified release baseline
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          BASELINE_DIR="$RUNNER_TEMP/release-baseline"
          mkdir -p "$BASELINE_DIR"
          git fetch --no-tags origin main
          git show origin/main:docs/reports/release-manifest.latest.json > "$RUNNER_TEMP/release-baseline/release-manifest.latest.json"
          jq -e '
            .schemaVersion == 1 and
            .status == "successful" and
            .complete == true and
            (.gitSha | type == "string" and test("^[0-9a-f]{40}$"))
          ' "$RUNNER_TEMP/release-baseline/release-manifest.latest.json" >/dev/null

      - name: Upload current verified release baseline
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-baseline-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-baseline/release-manifest.latest.json
          if-no-files-found: error
          retention-days: 1

      - name: Detect changes
        id: changes
        run: |
          # workflow_dispatch → 강제 전체 빌드+배포
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "workflow_dispatch — force full build"
            echo "build_all=true" >> $GITHUB_OUTPUT
            echo "build_base=true" >> $GITHUB_OUTPUT
            echo "build_api=true" >> $GITHUB_OUTPUT
            echo "build_video=true" >> $GITHUB_OUTPUT
            echo "build_messaging=true" >> $GITHUB_OUTPUT
            echo "build_ai=true" >> $GITHUB_OUTPUT
            echo "build_tools=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Each runtime can lag behind HEAD after a selective release. Derive
          # its diff base from the last verified image tag, not event.before:
          # a failed workflow followed by a hotfix push must still rebuild all
          # previously unshipped runtime changes.
          MANIFEST="$RUNNER_TEMP/release-baseline/release-manifest.latest.json"
          force_full_build() {
            echo "$1 — full build"
            echo "build_all=true" >> $GITHUB_OUTPUT
            echo "build_base=true" >> $GITHUB_OUTPUT
            echo "build_api=true" >> $GITHUB_OUTPUT
            echo "build_video=true" >> $GITHUB_OUTPUT
            echo "build_messaging=true" >> $GITHUB_OUTPUT
            echo "build_ai=true" >> $GITHUB_OUTPUT
            echo "build_tools=true" >> $GITHUB_OUTPUT
            exit 0
          }
          if ! jq -e '
            .schemaVersion == 1 and
            .status == "successful" and
            .complete == true and
            (.gitSha | type == "string" and test("^[0-9a-f]{40}$"))
          ' "$MANIFEST" >/dev/null; then
            force_full_build "No complete verified release manifest"
          fi

          resolve_image_base() {
            local repo="$1"
            local tag ref resolved
            tag=$(jq -er --arg repo "$repo" '.images[$repo].tag | select(type == "string")' "$MANIFEST") || return 1
            if [[ "$tag" =~ ^sha-([0-9a-f]{8,40})(-run-.+)?$ ]]; then
              ref="${BASH_REMATCH[1]}"
            else
              return 1
            fi
            resolved=$(git rev-parse --verify "${ref}^{commit}" 2>/dev/null) || return 1
            git merge-base --is-ancestor "$resolved" HEAD || return 1
            printf '%s' "$resolved"
          }

          RELEASE_PREV=$(jq -r '.gitSha' "$MANIFEST")
          git merge-base --is-ancestor "$RELEASE_PREV" HEAD ||
            force_full_build "Verified release is not an ancestor of HEAD"
          BASE_PREV=$(resolve_image_base "academy-base") ||
            force_full_build "academy-base source commit is unavailable"
          API_PREV=$(resolve_image_base "academy-api") ||
            force_full_build "academy-api source commit is unavailable"
          VIDEO_PREV=$(resolve_image_base "academy-video-worker") ||
            force_full_build "academy-video-worker source commit is unavailable"
          MSG_PREV=$(resolve_image_base "academy-messaging-worker") ||
            force_full_build "academy-messaging-worker source commit is unavailable"
          AI_PREV=$(resolve_image_base "academy-ai-worker-cpu") ||
            force_full_build "academy-ai-worker-cpu source commit is unavailable"
          TOOLS_PREV=$(resolve_image_base "academy-tools-worker") ||
            force_full_build "academy-tools-worker source commit is unavailable"

          CHANGED_RELEASE=$(git diff --name-only "$RELEASE_PREV" HEAD)
          CHANGED_BASE=$(git diff --name-only "$BASE_PREV" HEAD)
          CHANGED_API=$(git diff --name-only "$API_PREV" HEAD)
          CHANGED_VIDEO=$(git diff --name-only "$VIDEO_PREV" HEAD)
          CHANGED_MSG=$(git diff --name-only "$MSG_PREV" HEAD)
          CHANGED_AI=$(git diff --name-only "$AI_PREV" HEAD)
          CHANGED_TOOLS=$(git diff --name-only "$TOOLS_PREV" HEAD)
          CHANGED=$(printf '%s\n' \
            "$CHANGED_RELEASE" "$CHANGED_BASE" "$CHANGED_API" \
            "$CHANGED_VIDEO" "$CHANGED_MSG" "$CHANGED_AI" "$CHANGED_TOOLS" |
            sed '/^$/d' | sort -u)
          # Avoid echo|grep -q under GitHub's `bash -o pipefail`: on a large
          # multi-commit diff, grep can exit early and make echo fail with SIGPIPE.
          changed_matches() { grep -qE "$1" <<< "$CHANGED"; }
          # Local Codex worktree tooling is never copied for a product purpose.
          # Exclude it from accumulated per-image diffs as well as push triggers,
          # otherwise a later workflow-file change would reclassify it as API/AI.
          runtime_changes() { grep -vE '^scripts/codex/' <<< "$1" || true; }

          # 전체 빌드 트리거: base/공통 requirements와 모든 worker가 import하는 코드.
          # Worker settings가 apps.core/api.common/shared와 각 domain model을 초기화하고,
          # academy/libs/support/infrastructure는 여러 service entrypoint가 직접 import한다.
          FORCE_ALL=false
          changed_matches "^\.dockerignore$" && FORCE_ALL=true
          changed_matches "^docs/ssot/params\.yaml$" && FORCE_ALL=true
          changed_matches "^docker/Dockerfile\.base$" && FORCE_ALL=true
          changed_matches "^requirements/constraints\.txt$" && FORCE_ALL=true
          changed_matches "^requirements/common\.txt$" && FORCE_ALL=true
          changed_matches "^libs/" && FORCE_ALL=true
          changed_matches "^academy/" && FORCE_ALL=true
          changed_matches "^apps/shared/" && FORCE_ALL=true
          changed_matches "^apps/support/" && FORCE_ALL=true
          changed_matches "^apps/core/" && FORCE_ALL=true
          changed_matches "^apps/api/common/" && FORCE_ALL=true
          changed_matches "^apps/infrastructure/" && FORCE_ALL=true
          changed_matches "^apps/api/config/settings/worker\.py$" && FORCE_ALL=true
          changed_matches "^apps/(__init__\.py|(api|domains|worker)/__init__\.py|api/config(/settings)?/__init__\.py)$" && FORCE_ALL=true
          changed_matches "^apps/domains/[^/]+/(models(/|\.py$)|apps\.py$|signals(/|\.py$)|__init__\.py$)" && FORCE_ALL=true
          changed_matches "^manage\.py$" && FORCE_ALL=true

          if [ "$FORCE_ALL" = "true" ]; then
            echo "Core/shared change detected — full build"
            echo "build_all=true" >> $GITHUB_OUTPUT
            echo "build_base=true" >> $GITHUB_OUTPUT
            echo "build_api=true" >> $GITHUB_OUTPUT
            echo "build_video=true" >> $GITHUB_OUTPUT
            echo "build_messaging=true" >> $GITHUB_OUTPUT
            echo "build_ai=true" >> $GITHUB_OUTPUT
            echo "build_tools=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "build_all=false" >> $GITHUB_OUTPUT

          # Base image: only when Dockerfile.base, common requirements, or libs change
          CHANGED="$CHANGED_BASE"
          BASE=false
          changed_matches "^docker/Dockerfile\.base$" && BASE=true
          changed_matches "^docker/native-security/" && BASE=true
          changed_matches "^requirements/common\.txt$" && BASE=true
          changed_matches "^libs/" && BASE=true
          echo "build_base=$BASE" >> $GITHUB_OUTPUT

          # API: apps/ (대부분), docker/api/, requirements/api.txt
          CHANGED="$(runtime_changes "$CHANGED_API")"
          API=false
          changed_matches "^apps/" && API=true
          changed_matches "^scripts/" && API=true
          changed_matches "^docker/api/" && API=true
          changed_matches "^requirements/api\.txt$" && API=true
          # Legacy aggregate is consumed only by the API and Video Dockerfiles.
          changed_matches "^requirements/requirements\.txt$" && API=true
          echo "build_api=$API" >> $GITHUB_OUTPUT

          # Video worker
          # NOTE: video-worker 컨테이너는 manage.py로 video 도메인 관리 명령
          # (recover_dead_video_jobs, scan_stuck_video_jobs, reconcile_batch_video_jobs 등)을
          # 실행한다. 따라서 apps/domains/video/ 변경도 video 이미지 재빌드 + jobdef
          # rev 갱신이 필요하다. 2026-05-10: recover_dead_video_jobs 신규 시 trigger 누락
          # 사고로 ops jobdef가 옛 image를 가리킨 적 있음.
          CHANGED="$CHANGED_VIDEO"
          VIDEO=false
          changed_matches "^apps/worker/video_worker/" && VIDEO=true
          changed_matches "^apps/support/video/" && VIDEO=true
          changed_matches "^apps/domains/video/" && VIDEO=true
          # batch_main -> repositories_video -> messaging selectors/builders/scheduler
          changed_matches "^apps/domains/messaging/(services|selectors|scheduled)(/|\.py$)" && VIDEO=true
          changed_matches "^apps/domains/messaging/(alimtalk_content_builders|policy)\.py$" && VIDEO=true
          changed_matches "^apps/api/config/settings/worker\.py$" && VIDEO=true
          changed_matches "^docker/video-worker/" && VIDEO=true
          changed_matches "^requirements/worker-video\.txt$" && VIDEO=true
          changed_matches "^requirements/requirements\.txt$" && VIDEO=true
          echo "build_video=$VIDEO" >> $GITHUB_OUTPUT

          # Messaging worker
          # 헥사고날 cutover 후 apps/support/messaging/ → apps/domains/messaging/ 이동.
          # 워커가 alimtalk_content_builders / notification_dispatch / queue_service 등을
          # 직접 import하므로 도메인 코드 변경도 워커 이미지 재빌드 + ASG refresh 필요.
          # 누락 시 새 매핑/양식이 API에만 들어가고 워커는 옛 매핑으로 enqueue 처리 → 실효 X.
          CHANGED="$CHANGED_MSG"
          MSG=false
          changed_matches "^apps/worker/messaging_worker/" && MSG=true
          changed_matches "^apps/support/messaging/" && MSG=true
          changed_matches "^apps/domains/messaging/" && MSG=true
          # redis_progress_adapter imports the video worker heartbeat/status cache.
          changed_matches "^apps/domains/video/redis_status_cache\.py$" && MSG=true
          changed_matches "^apps/api/config/settings/worker\.py$" && MSG=true
          changed_matches "^docker/messaging-worker/" && MSG=true
          changed_matches "^requirements/worker-messaging\.txt$" && MSG=true
          echo "build_messaging=$MSG" >> $GITHUB_OUTPUT

          # AI worker
          # 워커는 콜백에서 매치업/인벤토리/커뮤니티/시험 도메인 모델을 SELECT한다.
          # 모델 FK 변경(예: matchup.inventory_file → inventory.InventoryFile) 시
          # 워커 settings INSTALLED_APPS 동기화가 필요하고, 코드 image 자체에도
          # 새 모델 정의가 들어가야 한다. 누락 시 운영 콜백 ValueError로 swallow → DB stuck.
          # 경험상(2026-04-27 inventory 누락) 보수적 트리거가 필요해 도메인 패턴을 넓게 잡는다.
          CHANGED="$(runtime_changes "$CHANGED_AI")"
          AI=false
          changed_matches "^apps/worker/ai_worker/" && AI=true
          changed_matches "^apps/worker/omr/" && AI=true
          changed_matches "^apps/domains/" && AI=true
          changed_matches "^apps/support/ai/" && AI=true
          changed_matches "^models/" && AI=true
          changed_matches "^scripts/" && AI=true
          changed_matches "^apps/api/config/settings/(worker|base)\.py$" && AI=true
          changed_matches "^academy/" && AI=true
          changed_matches "^libs/queue/" && AI=true
          changed_matches "^docker/ai-worker" && AI=true
          changed_matches "^requirements/worker-ai" && AI=true
          echo "build_ai=$AI" >> $GITHUB_OUTPUT

          # Tools worker: deterministic document conversion/spreadsheet jobs without AI model caches.
          CHANGED="$CHANGED_TOOLS"
          TOOLS=false
          changed_matches "^apps/worker/tools_worker/" && TOOLS=true
          changed_matches "^apps/domains/tools/" && TOOLS=true
          changed_matches "^apps/domains/ai/queueing/" && TOOLS=true
          # ai_sqs_worker and worker_job_types import these modules outside queueing/.
          changed_matches "^apps/domains/ai/(callbacks|job_types)\.py$" && TOOLS=true
          changed_matches "^apps/domains/ai/gateway\.py$" && TOOLS=true
          changed_matches "^apps/domains/results/services/(wrong_note_pdf_(service|worker)|wrong_note_service|answer_matching)\.py$" && TOOLS=true
          changed_matches "^apps/domains/assets/omr/renderer/fonts/" && TOOLS=true
          changed_matches "^apps/domains/submissions/services/(ai_omr_result_mapper|lifecycle)\.py$" && TOOLS=true
          changed_matches "^apps/support/ai/callback_dependencies\.py$" && TOOLS=true
          changed_matches "^academy/adapters/cache/redis_progress_adapter\.py$" && TOOLS=true
          changed_matches "^apps/support/ai/services/sqs_queue\.py$" && TOOLS=true
          changed_matches "^academy/(application/use_cases/tools|domain/tools|adapters/tools|framework/workers|adapters/queue/sqs)/" && TOOLS=true
          changed_matches "^academy/application/(services/excel_parsing_service|use_cases/ai/pipelines/(ppt_handler|excel_handler|excel_export_handler))\.py$" && TOOLS=true
          changed_matches "^apps/api/config/settings/(worker|base)\.py$" && TOOLS=true
          changed_matches "^docker/tools-worker/" && TOOLS=true
          changed_matches "^requirements/worker-tools\.txt$" && TOOLS=true
          echo "build_tools=$TOOLS" >> $GITHUB_OUTPUT

          echo "Detection complete: api=$API video=$VIDEO messaging=$MSG ai=$AI tools=$TOOLS"

  # ============================================================
  # Phase 1.4: Static lint (deploy gate)
  # ----------------------------------------------------------------
  # 도입 배경 (2026-05-10): D-9 분리 후 `MatchupProblem` 미정의로 학원장 적중보고서
  # 진입 500 사고 발생. 같은 분리 직후 `_is_tenant_staff` 미정의 hotfix 한 번 더.
  # CI 정적 검증 부재가 진짜 구조 결함 → ruff F821(undefined-name) + F401
  # (unused-import) 활성화. 도메인별 점진 도입 (pyproject.toml `per-file-ignores`).
  # 신규 NameError 결함은 무조건 빌드/배포 차단.
  # ============================================================
  run-lint:
    name: Ruff lint (deploy gate)
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install --quiet ruff

      - name: Run ruff
        run: |
          ruff check apps/ academy/

      - name: Submission lifecycle boundary guard
        run: |
          python scripts/lint/check_submission_lifecycle_boundary.py

      - name: Safe HTTP method database-write boundary
        run: |
          python -m unittest scripts.lint.test_check_safe_method_writes
          python scripts/lint/check_safe_method_writes.py

      - name: Refactor boundary touched-file guard
        run: |
          if [ "${{ github.event_name }}" = "push" ] && \
             [ -n "${{ github.event.before }}" ] && \
             [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            python scripts/lint/refactor_boundary_snapshot.py --strict-touched --base-ref "${{ github.event.before }}"
          else
            python scripts/lint/refactor_boundary_snapshot.py --strict-touched
          fi

      - name: Refactor boundary baseline guard
        run: |
          python scripts/lint/refactor_boundary_snapshot.py --enforce-baseline

      - name: Expand/contract migration guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          ALLOW_CONTRACT_MIGRATIONS: ${{ inputs.allow_contract_migrations || false }}
        run: |
          set -euo pipefail
          python -m unittest scripts.lint.test_check_expand_contract_migrations
          BASE_REF="HEAD^"
          if [ "$EVENT_NAME" = "push" ] && \
             [ -n "$EVENT_BEFORE" ] && \
             [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE_REF="$EVENT_BEFORE"
          fi
          ARGS=(--base-ref "$BASE_REF")
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && \
             [ "$ALLOW_CONTRACT_MIGRATIONS" = "true" ]; then
            ARGS+=(--allow-contract)
          fi
          python scripts/lint/check_expand_contract_migrations.py "${ARGS[@]}"

  # ============================================================
  # Phase 1.5: Run smoke tests (deploy gate)
  # ============================================================
  run-tests:
    name: Smoke tests (deploy gate)
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements/requirements.txt
            requirements/api.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/requirements.txt -r requirements/api.txt
          pip install pytest pytest-django

      - name: Run smoke tests
        env:
          DJANGO_SETTINGS_MODULE: apps.api.config.settings.test
        run: |
          pytest tests/test_smoke.py tests/test_critical_academy_journey.py -v --tb=short -x

      - name: Verify deployment evidence contracts
        shell: pwsh
        run: |
          ./scripts/v1/test-verification-contract.ps1
          ./scripts/v1/test-candidate-env-contract.ps1
          ./scripts/v1/test-aws-json-utf8-contract.ps1
          ./scripts/v1/test-production-source-freshness.ps1
          ./scripts/v1/test-workflow-governance-contract.ps1

  # ============================================================
  # Phase 2: Build and push immutable candidate images
  # ----------------------------------------------------------------
  # Note: every build-push-action step sets `provenance: false` and
  # `sbom: false`. Default v7 behavior emits SLSA provenance + SBOM
  # attestations as a separate `unknown/unknown` platform manifest
  # under the OCI index, plus a `*.dockerbuild` artifact per build.
  # In our environment (private ECR, OIDC-only push, single ARM64 arch)
  # these attestations are never consumed downstream, and they
  # (a) accumulated 22K Actions artifacts in this repo, and
  # (b) worsened the OCI-index lifecycle cleanup problem.
  # Revisit if we start publishing images externally or need
  # signed provenance for SOC/supply-chain audits.
  # ============================================================
  acquire-production-lock:
    name: Acquire shared production mutation lock
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    needs: [detect-changes, run-lint, run-tests]
    if: |
      needs.detect-changes.outputs.build_base == 'true' ||
      needs.detect-changes.outputs.build_api == 'true' ||
      needs.detect-changes.outputs.build_video == 'true' ||
      needs.detect-changes.outputs.build_messaging == 'true' ||
      needs.detect-changes.outputs.build_ai == 'true' ||
      needs.detect-changes.outputs.build_tools == 'true' ||
      needs.detect-changes.outputs.force_full == 'true'
    steps:
      - name: Checkout deployment guards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            scripts/v1/deployment_lock.py
            scripts/v1/release_freshness.py
          sparse-checkout-cone-mode: false
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_FOR_ECR_BUILD }}
          aws-region: ${{ env.AWS_REGION }}
          action-timeout-s: 180
      - name: Seal retired v1 lock generation
        env:
          ACADEMY_DEPLOY_LOCK_OWNER: ci-deploy:${{ github.run_id }}:${{ github.run_attempt }}
        run: python3 scripts/v1/deployment_lock.py seal-legacy --owner "$ACADEMY_DEPLOY_LOCK_OWNER"
      - name: Acquire lock
        env:
          ACADEMY_DEPLOY_LOCK_OWNER: ci-deploy:${{ github.run_id }}:${{ github.run_attempt }}
        run: python3 scripts/v1/deployment_lock.py acquire --owner "$ACADEMY_DEPLOY_LOCK_OWNER" --ttl-seconds 10800

  verify-release-freshness:
    name: Refuse stale production release candidates
    runs-on: ubuntu-latest
    needs: [acquire-production-lock]
    steps:
      - name: Checkout release guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            scripts/v1/release_freshness.py
            docs/reports/release-manifest.latest.json
          sparse-checkout-cone-mode: false
      - name: Refuse stale or divergent release candidates
        env:
          ACADEMY_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          DEPLOYED_SHA="$(git show origin/main:docs/reports/release-manifest.latest.json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("gitSha", ""))')"
          python3 scripts/v1/release_freshness.py \
            --candidate-sha "$ACADEMY_CANDIDATE_SHA" \
            --deployed-sha "$DEPLOYED_SHA" \
            --main-sha "$MAIN_SHA"

  verify-runtime-iam:
    name: Verify exact runtime worker-scale IAM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [acquire-production-lock, verify-release-freshness]
    steps:
      - name: Checkout exact runtime policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/v1/templates/iam/policy_api_ai_worker_scale.json
            scripts/v1/templates/iam/policy_ec2_cloudwatch_logs.json
            scripts/v1/templates/iam/policy_workers_sqs.json
          sparse-checkout-cone-mode: false
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_FOR_ECR_BUILD }}
          aws-region: ${{ env.AWS_REGION }}
          action-timeout-s: 180
      - name: Read back and verify exact runtime policies and log sinks
        run: |
          set -euo pipefail
          aws iam get-role-policy \
            --role-name academy-ec2-role \
            --policy-name academy-api-ai-worker-scale \
            --query PolicyDocument \
            --output json > /tmp/runtime-policy.actual.json
          aws iam get-role-policy \
            --role-name academy-ec2-role \
            --policy-name academy-ec2-cloudwatch-logs \
            --query PolicyDocument \
            --output json > /tmp/runtime-logging-policy.actual.json
          aws iam get-role-policy \
            --role-name academy-ec2-role \
            --policy-name academy-workers-sqs \
            --query PolicyDocument \
            --output json > /tmp/runtime-worker-sqs-policy.actual.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          policies = (
              (
                  "scripts/v1/templates/iam/policy_api_ai_worker_scale.json",
                  "/tmp/runtime-policy.actual.json",
                  "runtime worker-scale IAM readback mismatch",
              ),
              (
                  "scripts/v1/templates/iam/policy_ec2_cloudwatch_logs.json",
                  "/tmp/runtime-logging-policy.actual.json",
                  "runtime logging IAM readback mismatch",
              ),
              (
                  "scripts/v1/templates/iam/policy_workers_sqs.json",
                  "/tmp/runtime-worker-sqs-policy.actual.json",
                  "runtime worker SQS IAM readback mismatch",
              ),
          )
          for expected_path, actual_path, error in policies:
              expected = json.loads(Path(expected_path).read_text())
              actual = json.loads(Path(actual_path).read_text())
              if actual != expected:
                  raise SystemExit(error)
          PY
          for LOG_GROUP in /academy/api /academy/ai-worker /academy/tools-worker; do
            LOG_GROUPS=$(aws logs describe-log-groups \
              --log-group-name-prefix "$LOG_GROUP" \
              --region "${{ env.AWS_REGION }}" \
              --output json)
            RETENTION=$(jq -r --arg name "$LOG_GROUP" \
              '.logGroups[] | select(.logGroupName == $name) | .retentionInDays // empty' \
              <<< "$LOG_GROUPS")
            if [ "$RETENTION" != "30" ]; then
              echo "::error::runtime log group readback mismatch: group=$LOG_GROUP retention=${RETENTION:-missing} expected=30"
              exit 1
            fi
            echo "Runtime log sink PASS: group=$LOG_GROUP retention=${RETENTION}d"
          done

  prepare-build:
    name: Prepare immutable base image
    runs-on: ubuntu-latest
    outputs:
      base_image_uri: ${{ steps.base-image.outputs.uri }}
    permissions:
      contents: read
      id-token: write
    needs: [detect-changes, run-lint, run-tests, acquire-production-lock, verify-release-freshness, verify-runtime-iam]
    if: |
      needs.detect-changes.outputs.build_base == 'true' ||
      needs.detect-changes.outputs.build_api == 'true' ||
      needs.detect-changes.outputs.build_video == 'true' ||
      needs.detect-changes.outputs.build_messaging == 'true' ||
      needs.detect-changes.outputs.build_ai == 'true' ||
      needs.detect-changes.outputs.build_tools == 'true' ||
      needs.detect-changes.outputs.force_full == 'true'
    env:
      # Job-level env guarantees docker/build-push-action sees these regardless of
      # workflow-vs-step env precedence subtleties. RECORD_UPLOAD=false stops the
      # *.dockerbuild summary artifact upload (the actually accumulating one);
      # SUMMARY=false hides the rendered summary panel.
      DOCKER_BUILD_RECORD_UPLOAD: false
      DOCKER_BUILD_SUMMARY: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download current verified release baseline
        if: github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-baseline-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-baseline

      - name: Set up QEMU
        if: needs.detect-changes.outputs.build_base == 'true' || needs.detect-changes.outputs.force_full == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        if: needs.detect-changes.outputs.build_base == 'true' || needs.detect-changes.outputs.force_full == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Configure AWS credentials (OIDC only)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_FOR_ECR_BUILD }}
          aws-region: ${{ env.AWS_REGION }}
          action-timeout-s: 180

      - name: Renew shared mutation lock before image writes
        run: python3 scripts/v1/deployment_lock.py renew --owner "$ACADEMY_DEPLOY_LOCK_OWNER" --ttl-seconds 10800

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Ensure ECR repos
        run: |
          set -euo pipefail
          for repo in academy-base academy-api academy-video-worker academy-messaging-worker academy-ai-worker-cpu academy-tools-worker; do
            if ! aws ecr describe-repositories --repository-names "$repo" --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
              aws ecr create-repository \
                --repository-name "$repo" \
                --image-tag-mutability IMMUTABLE_WITH_EXCLUSION \
                --image-tag-mutability-exclusion-filters filterType=WILDCARD,filter=latest \
                --image-scanning-configuration scanOnPush=true \
                --region ${{ env.AWS_REGION }} >/dev/null
            else
              aws ecr put-image-tag-mutability \
                --repository-name "$repo" \
                --image-tag-mutability IMMUTABLE_WITH_EXCLUSION \
                --image-tag-mutability-exclusion-filters filterType=WILDCARD,filter=latest \
                --region ${{ env.AWS_REGION }} >/dev/null
              aws ecr put-image-scanning-configuration \
                --repository-name "$repo" \
                --image-scanning-configuration scanOnPush=true \
                --region ${{ env.AWS_REGION }} >/dev/null
            fi
            CONFIG=$(aws ecr describe-repositories --repository-names "$repo" --region ${{ env.AWS_REGION }} --query 'repositories[0]' --output json)
            if ! jq -e '
              .imageTagMutability == "IMMUTABLE_WITH_EXCLUSION" and
              .imageScanningConfiguration.scanOnPush == true and
              (.imageTagMutabilityExclusionFilters | length == 1) and
              (.imageTagMutabilityExclusionFilters[0].filterType == "WILDCARD") and
              (.imageTagMutabilityExclusionFilters[0].filter == "latest")
            ' <<< "$CONFIG" >/dev/null; then
              echo "::error::ECR tag mutability is not latest-only mutable for $repo"
              exit 1
            fi
          done

      # ── Base image (only when base-relevant files change) ──
      - name: Build and push academy-base (arm64)
        if: needs.detect-changes.outputs.build_base == 'true' || needs.detect-changes.outputs.force_full == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.base
          build-args: APT_REFRESH_TOKEN=${{ github.run_id }}-${{ github.run_attempt }}
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ECR_REGISTRY }}/academy-base:${{ env.RELEASE_IMAGE_TAG }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Resolve immutable academy-base build input
        id: base-image
        run: |
          if [ "${{ needs.detect-changes.outputs.build_base }}" = "true" ] || [ "${{ needs.detect-changes.outputs.force_full }}" = "true" ]; then
            BASE_DIGEST=$(aws ecr describe-images \
              --repository-name academy-base \
              --image-ids "imageTag=${{ env.RELEASE_IMAGE_TAG }}" \
              --region ${{ env.AWS_REGION }} \
              --query 'imageDetails[0].imageDigest' \
              --output text)
          else
            BASELINE="$RUNNER_TEMP/release-baseline/release-manifest.latest.json"
            if [ ! -f "$BASELINE" ]; then
              echo "::error::No successful release manifest exists. Run workflow_dispatch once to build all images."
              exit 1
            fi
            BASE_DIGEST=$(jq -r '.images["academy-base"].digest // empty' "$BASELINE")
          fi
          if [[ ! "$BASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::academy-base digest resolution failed"
            exit 1
          fi
          aws ecr describe-images --repository-name academy-base --image-ids "imageDigest=$BASE_DIGEST" --region ${{ env.AWS_REGION }} >/dev/null
          BASE_URI="${{ env.ECR_REGISTRY }}/academy-base@${BASE_DIGEST}"
          echo "uri=$BASE_URI" >> "$GITHUB_OUTPUT"
          echo "Using immutable base image: $BASE_URI"

  build-runtime-images:
    name: Build ${{ matrix.repository }} (arm64)
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    needs: [detect-changes, prepare-build]
    if: |
      needs.detect-changes.outputs.build_api == 'true' ||
      needs.detect-changes.outputs.build_video == 'true' ||
      needs.detect-changes.outputs.build_messaging == 'true' ||
      needs.detect-changes.outputs.build_ai == 'true' ||
      needs.detect-changes.outputs.build_tools == 'true' ||
      needs.detect-changes.outputs.force_full == 'true'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - service: api
            repository: academy-api
            dockerfile: docker/api/Dockerfile
            cache_scope: api
            runner: ubuntu-latest
          - service: video
            repository: academy-video-worker
            dockerfile: docker/video-worker/Dockerfile
            cache_scope: video
            runner: ubuntu-24.04-arm
          - service: messaging
            repository: academy-messaging-worker
            dockerfile: docker/messaging-worker/Dockerfile
            cache_scope: messaging
            runner: ubuntu-latest
          - service: ai
            repository: academy-ai-worker-cpu
            dockerfile: docker/ai-worker-cpu/Dockerfile
            cache_scope: ai-cpu
            runner: ubuntu-latest
          - service: tools
            repository: academy-tools-worker
            dockerfile: docker/tools-worker/Dockerfile
            cache_scope: tools
            runner: ubuntu-latest
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
      DOCKER_BUILD_SUMMARY: false
      BUILD_API: ${{ needs.detect-changes.outputs.build_api }}
      BUILD_VIDEO: ${{ needs.detect-changes.outputs.build_video }}
      BUILD_MESSAGING: ${{ needs.detect-changes.outputs.build_messaging }}
      BUILD_AI: ${{ needs.detect-changes.outputs.build_ai }}
      BUILD_TOOLS: ${{ needs.detect-changes.outputs.build_tools }}
      FORCE_FULL: ${{ needs.detect-changes.outputs.force_full }}
    steps:
      - name: Select changed runtime image
        id: selection
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.service }}" in
            api) SHOULD_BUILD="$BUILD_API" ;;
            video) SHOULD_BUILD="$BUILD_VIDEO" ;;
            messaging) SHOULD_BUILD="$BUILD_MESSAGING" ;;
            ai) SHOULD_BUILD="$BUILD_AI" ;;
            tools) SHOULD_BUILD="$BUILD_TOOLS" ;;
            *) echo "::error::Unknown runtime service: ${{ matrix.service }}"; exit 1 ;;
          esac
          if [ "$FORCE_FULL" = "true" ]; then SHOULD_BUILD=true; fi
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.repository }} build selected: $SHOULD_BUILD"

      - name: Checkout
        if: steps.selection.outputs.should_build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: steps.selection.outputs.should_build == 'true' && matrix.service != 'video'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        if: steps.selection.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Configure AWS credentials (OIDC only)
        if: steps.selection.outputs.should_build == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_FOR_ECR_BUILD }}
          aws-region: ${{ env.AWS_REGION }}
          action-timeout-s: 180

      - name: Renew shared mutation lock before image write
        if: steps.selection.outputs.should_build == 'true'
        run: python3 scripts/v1/deployment_lock.py renew --owner "$ACADEMY_DEPLOY_LOCK_OWNER" --ttl-seconds 10800

      - name: Login to Amazon ECR
        if: steps.selection.outputs.should_build == 'true'
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build and push ${{ matrix.repository }} (arm64)
        if: steps.selection.outputs.should_build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: BASE_IMAGE=${{ needs.prepare-build.outputs.base_image_uri }}
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.repository }}:${{ env.RELEASE_IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  build-and-push:
    name: Assemble and scan release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    needs: [detect-changes, prepare-build, build-runtime-images]
    if: |
      needs.detect-changes.outputs.build_base == 'true' ||
      needs.detect-changes.outputs.build_api == 'true' ||
      needs.detect-changes.outputs.build_video == 'true' ||
      needs.detect-changes.outputs.build_messaging == 'true' ||
      needs.detect-changes.outputs.build_ai == 'true' ||
      needs.detect-changes.outputs.build_tools == 'true' ||
      needs.detect-changes.outputs.force_full == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.ACADEMY_RELEASE_DEPLOY_KEY }}

      - name: Download current verified release baseline
        if: github.event_name == 'push'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-baseline-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-baseline

      - name: Configure AWS credentials (OIDC only)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_FOR_ECR_BUILD }}
          aws-region: ${{ env.AWS_REGION }}
          action-timeout-s: 180

      - name: Renew shared mutation lock before candidate assembly
        run: python3 scripts/v1/deployment_lock.py renew --owner "$ACADEMY_DEPLOY_LOCK_OWNER" --ttl-seconds 10800

      # ── Build report + complete release candidate ──
      - name: Collect exact release digests and write candidate manifest
        id: digests
        run: |
          set -euo pipefail
          BUILD_TIME=$(date -Iseconds)
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:8}"
          REPORTS_DIR="docs/reports"
          mkdir -p "$REPORTS_DIR"

          cat > "$REPORTS_DIR/ci-build.latest.md" <<HEREDOC
          ## V1.1.0 CI Build — immutable release candidate (OIDC)

          **Generated:** $BUILD_TIME
          **SSOT:** docs/infrastructure/deployment-architecture.md
          **Region:** ${{ env.AWS_REGION }}
          **gitSha:** $SHA
          **shortSha:** $SHORT_SHA
          **releaseImageTag:** ${{ env.RELEASE_IMAGE_TAG }}
          **Changes:** api=${{ needs.detect-changes.outputs.build_api }} video=${{ needs.detect-changes.outputs.build_video }} messaging=${{ needs.detect-changes.outputs.build_messaging }} ai=${{ needs.detect-changes.outputs.build_ai }} tools=${{ needs.detect-changes.outputs.build_tools }} force_full=${{ needs.detect-changes.outputs.force_full }}

          | repo | tags | imageDigest |
          |------|------|-------------|
          HEREDOC

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' "$REPORTS_DIR/ci-build.latest.md"

          PRIOR="$RUNNER_TEMP/release-baseline/release-manifest.latest.json"
          CANDIDATE="$REPORTS_DIR/release-manifest.candidate.json"
          jq -n \
            --arg generatedAt "$BUILD_TIME" \
            --arg gitSha "$SHA" \
            --arg releaseImageTag "${{ env.RELEASE_IMAGE_TAG }}" \
            '{schemaVersion:1,status:"candidate",complete:false,generatedAt:$generatedAt,gitSha:$gitSha,releaseImageTag:$releaseImageTag,images:{}}' \
            > "$CANDIDATE"

          for repo in academy-base academy-api academy-video-worker academy-messaging-worker academy-ai-worker-cpu academy-tools-worker; do
            BUILT=false
            case "$repo" in
              academy-base) BUILT="${{ needs.detect-changes.outputs.build_base }}" ;;
              academy-api) BUILT="${{ needs.detect-changes.outputs.build_api }}" ;;
              academy-video-worker) BUILT="${{ needs.detect-changes.outputs.build_video }}" ;;
              academy-messaging-worker) BUILT="${{ needs.detect-changes.outputs.build_messaging }}" ;;
              academy-ai-worker-cpu) BUILT="${{ needs.detect-changes.outputs.build_ai }}" ;;
              academy-tools-worker) BUILT="${{ needs.detect-changes.outputs.build_tools }}" ;;
            esac
            if [ "${{ needs.detect-changes.outputs.force_full }}" = "true" ]; then BUILT=true; fi

            if [ "$BUILT" = "true" ]; then
              TAG="${{ env.RELEASE_IMAGE_TAG }}"
              DIGEST=$(aws ecr describe-images \
                --repository-name "$repo" \
                --image-ids "imageTag=$TAG" \
                --region ${{ env.AWS_REGION }} \
                --query 'imageDetails[0].imageDigest' \
                --output text)
              SOURCE="built"
            else
              if [ ! -f "$PRIOR" ] || ! jq -e '.complete == true and .status == "successful"' "$PRIOR" >/dev/null; then
                echo "::error::A selective build requires a complete successful prior release manifest. Run workflow_dispatch for a full build."
                exit 1
              fi
              DIGEST=$(jq -r --arg repo "$repo" '.images[$repo].digest // empty' "$PRIOR")
              TAG=$(jq -r --arg repo "$repo" '.images[$repo].tag // "digest-only"' "$PRIOR")
              SOURCE="prior-success"
            fi

            if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid release digest for $repo: $DIGEST"
              exit 1
            fi
            aws ecr describe-images --repository-name "$repo" --image-ids "imageDigest=$DIGEST" --region ${{ env.AWS_REGION }} >/dev/null
            jq \
              --arg repo "$repo" --arg digest "$DIGEST" --arg tag "$TAG" --arg source "$SOURCE" \
              '.images[$repo]={digest:$digest,tag:$tag,source:$source}' \
              "$CANDIDATE" > "$CANDIDATE.tmp"
            mv "$CANDIDATE.tmp" "$CANDIDATE"
            echo "| $repo | $TAG ($SOURCE) | $DIGEST |" >> "$REPORTS_DIR/ci-build.latest.md"
          done

          if [ "$(jq '.images | length' "$CANDIDATE")" -ne 6 ]; then
            echo "::error::Release candidate is incomplete"
            exit 1
          fi

          echo "buildTime=$BUILD_TIME" >> $GITHUB_OUTPUT

      - name: Gate newly built images on completed ECR critical scan
        run: |
          python scripts/v1/ecr-critical-scan-gate.py \
            --candidate docs/reports/release-manifest.candidate.json \
            --acceptances docs/ssot/ecr-critical-risk-acceptance.json \
            --high-baseline docs/ssot/ecr-high-risk-baseline.json \
            --region "${{ env.AWS_REGION }}"

      - name: Workflow summary
        run: |
          echo "## V1.1.0 Build and Push (OIDC)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }} (sha-${{ needs.detect-changes.outputs.short_sha }})" >> $GITHUB_STEP_SUMMARY
          echo "**Changes:** api=${{ needs.detect-changes.outputs.build_api }} video=${{ needs.detect-changes.outputs.build_video }} messaging=${{ needs.detect-changes.outputs.build_messaging }} ai=${{ needs.detect-changes.outputs.build_ai }} tools=${{ needs.detect-changes.outputs.build_tools }} force_full=${{ needs.detect-changes.outputs.force_full }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat docs/reports/ci-build.latest.md >> $GITHUB_STEP_SUMMARY

      - name: Upload ci-build.latest.md artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-build-report
          path: |
            docs/reports/ci-build.latest.md
            docs/reports/release-manifest.candidate.json
          retention-days: 7

      - name: Commit and push ci-build.latest.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          REPORT_TMP="$(mktemp)"
          cp docs/reports/ci-build.latest.md "$REPORT_TMP"
          COMMIT_MSG="chore(ci): update ci-build.latest.md [V1.1.0] (sha-${{ needs.detect-changes.outputs.short_sha }}) [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p docs/reports
            cp "$REPORT_TMP" docs/reports/ci-build.latest.md
            git add docs/reports/ci-build.latest.md

            if git diff --staged --quiet; then
              echo "No change to ci-build.latest.md"
              exit 0
            fi

            git commit -m "$COMMIT_MSG"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "ci-build.latest.md push attempt $attempt failed; retrying on latest origin/main"
          done

          echo "::warning::ci-build.latest.md push failed after retries (non-critical)"
          exit 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Phase 3: Persistent isolated development review (before preprod/production)
  # ============================================================
  verify-api-development:
    name: Verify candidate on persistent isolated development runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [detect-changes, build-and-push]
    if: |
      always() &&
      needs.build-and-push.result == 'success'
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-build-report
          path: /tmp/api-development-candidate

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_FOR_ECR_BUILD }}
          aws-region: ${{ env.AWS_REGION }}
          action-timeout-s: 180

      - name: Publish release-bound isolated development environment
        id: development-env
        shell: pwsh
        run: |
          ./scripts/v1/publish-api-development-env.ps1 `
            -ReleaseId "${{ env.RELEASE_IMAGE_TAG }}" `
            -GithubOutputPath $env:GITHUB_OUTPUT `
            -Ci

      - name: Blue/green candidate review on persistent development runtime
        shell: pwsh
        run: |
          python3 scripts/v1/deployment_lock.py renew `
            --owner "$env:ACADEMY_DEPLOY_LOCK_OWNER" `
            --ttl-seconds 10800
          $candidate = Get-Content `
            /tmp/api-development-candidate/release-manifest.candidate.json `
            -Raw | ConvertFrom-Json
          $apiDigest = [string]$candidate.images.'academy-api'.digest
          $toolsDigest = [string]$candidate.images.'academy-tools-worker'.digest
          $aiDigest = [string]$candidate.images.'academy-ai-worker-cpu'.digest
          if ($apiDigest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw "Invalid API digest in release candidate: $apiDigest"
          }
          if ($toolsDigest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw "Invalid Tools digest in release candidate: $toolsDigest"
          }
          if ($aiDigest -notmatch '^sha256:[0-9a-f]{64}$') {
            throw "Invalid AI digest in release candidate: $aiDigest"
          }
          ./scripts/v1/deploy-api-development.ps1 `
            -ApiImageUri "${{ env.ECR_REGISTRY }}/academy-api@$apiDigest" `
            -ToolsImageUri "${{ env.ECR_REGISTRY }}/academy-tools-worker@$toolsDigest" `
            -AiImageUri "${{ env.ECR_REGISTRY }}/academy-ai-worker-cpu@$aiDigest" `
            -ExpectedEnvVersion "${{ steps.development-env.outputs.parameter_version }}" `
            -ExpectedWorkersEnvVersion "${{ steps.development-env.outputs.workers_parameter_version }}" `
            -ExpectedReleaseId "${{ steps.development-env.outputs.release_id }}" `
            -ExpectedProductionDatabaseName "${{ steps.development-env.outputs.production_database_name }}" `
            -Ci

  # ============================================================
  # Phase 4: Isolated preprod server (before any production mutation)
  # ============================================================
  verify-api-preprod:
    name: Verify candidate on isolated API preprod server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [detect-changes, build-and-push, verify-api-development]
    if: |
      always() &&
      needs.build-and-push.result == 'success' &&
      (
        needs.verify-api-development.result == 'success' ||
        needs.verify-api-development.result == 'skipped'
      )
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-build-report
          path: /tmp/api-preprod-candidate

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_FOR_ECR_BUILD }}
          aws-region: ${{ env.AWS_REGION }}
          action-timeout-s: 180

      - name: Publish release-bound preprod environment
        id: preprod-env
        shell: pwsh
        run: |
          ./scripts/v1/publish-api-preprod-env.ps1 `
            -ReleaseId "${{ env.RELEASE_IMAGE_TAG }}" `
            -GithubOutputPath $env:GITHUB_OUTPUT `
            -Ci

      - name: Run isolated server, migration, and health gate
        run: |
          set -euo pipefail
          python3 scripts/v1/deployment_lock.py renew --owner "$ACADEMY_DEPLOY_LOCK_OWNER" --ttl-seconds 10800
          API_DIGEST=$(jq -r '.images["academy-api"].digest // empty' /tmp/api-preprod-candidate/release-manifest.candidate.json)
          if [[ ! "$API_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid API digest in release candidate: $API_DIGEST"
            exit 1
          fi
          pwsh ./scripts/v1/run-api-preprod-canary.ps1 \
            -ImageUri "${{ env.ECR_REGISTRY }}/academy-api@$API_DIGEST" \
            -ExpectedEnvVersion "${{ steps.preprod-env.outputs.parameter_version }}" \
            -ExpectedReleaseId "${{ steps.preprod-env.outputs.release_id }}" \
            -ExpectedDatabaseName "${{ steps.preprod-env.outputs.preprod_database_name }}" \
            -ExpectedDatabaseUser "${{ steps.preprod-env.outputs.preprod_database_user }}" \
            -ExpectedProductionDatabaseName "${{ steps.preprod-env.outputs.production_database_name }}" \
            -Ci

  # ============================================================
  # Phase 5: Production database migrations (after development and preprod passed)
  # ============================================================
  run-migrations:
    name: Run database migrations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [detect-changes, build-and-push, verify-api-preprod]
    if: |
      always() &&
      needs.build-and-push.result == 'success' &&
      needs.verify-api-preprod.result == 'success' &&
      (needs.detect-changes.outputs.build_api == 'true' || needs.detect-changes.outputs.force_full == 'true')
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_FOR_ECR_BUILD }}
          aws-region: ${{ env.AWS_REGION }}
          action-timeout-s: 180

      - name: Renew shared mutation lock before migration
        run: python3 scripts/v1/deployment_lock.py renew --owner "$ACADEMY_DEPLOY_LOCK_OWNER" --ttl-seconds 10800

      - name: Run Django migrate via SSM
        id: migrate
        run: |
          # Find a running API instance to run migrations on (before refresh)
          # Retry up to 90s — previous ASG refresh may still be draining
          INSTANCE_ID=""
          for ATTEMPT in $(seq 1 6); do
            INSTANCE_ID=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names academy-v1-api-asg \
              --region ${{ env.AWS_REGION }} \
              --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId | [0]' \
              --output text)

            if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
              echo "Found InService instance: $INSTANCE_ID (attempt $ATTEMPT)"
              break
            fi
            echo "No InService instance yet (attempt $ATTEMPT/6), waiting 15s..."
            sleep 15
            INSTANCE_ID=""
          done

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::No InService API instance found after 90s. Cannot run migrations."
            exit 1
          fi

          echo "Running migrations on instance: $INSTANCE_ID"

          # Account ID 동적 추출 (secrets 추가 없이)
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text --region ${{ env.AWS_REGION }})
          ECR_HOST="${AWS_ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          IMAGE_TAG="${{ env.RELEASE_IMAGE_TAG }}"
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name academy-api \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --region ${{ env.AWS_REGION }} \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Migration image digest resolution failed for academy-api:${IMAGE_TAG}"
            exit 1
          fi
          ECR_IMAGE="${ECR_HOST}/academy-api@${IMAGE_DIGEST}"
          echo "Migration image pinned: ${ECR_IMAGE}"

          # ⚠️ 중요: 기존 `docker exec academy-api`는 ASG refresh 이전의 구 이미지에서
          # migrate를 실행해 새 migration 파일이 포함되지 않는 설계 결함이 있었다.
          # 이를 해결하기 위해 이 workflow가 방금 빌드한 sha-* 태그를 digest로
          # 해석해 pull한 뒤 --rm 임시 컨테이너에서 migrate를 실행한다. digest로
          # 고정하므로 이후 latest 이동과 무관하다. 환경변수는 application 컨테이너가 spawn 시 사용한 동일
          # /opt/api.env 파일을 직접 마운트(production runtime SSOT).
          # 네트워크는 --network container:academy-api로 공유하여 DB 접근을 보장한다.
          #
          # 2026-05-12 fix: `docker inspect Config.Env` / `docker exec env` 둘 다 SECRET_KEY
          # 누락. 원인은 production EC2의 academy-api가 `docker run --env-file /opt/api.env`
          # 로 spawn — special chars(=, \n, quotes) 포함된 env value가 inspect/exec output
          # 에서 잘림. application은 docker가 env로 정상 inject한 값을 받지만 dump output은
          # 부정확. 결과적으로 새 임시 컨테이너가 SECRET_KEY 못 받아 prod.py assertion fail.
          #
          # 근본 fix: migration 직전에 SSM runtime SSOT를 /opt/api.env로 원자적으로
          # 동기화한다. ASG refresh 전 새 필수 환경변수가 추가되어도 stale env 때문에
          # migration이 막히지 않으며, 실행 중인 구 API 컨테이너는 재시작하지 않는다.
          # 동기화된 파일을 migration 임시 컨테이너에 동일하게 --env-file로 inject한다.
          MIGRATE_CMD="set -e; umask 077; ENV_JSON=\$(aws ssm get-parameter --name /academy/api/env --with-decryption --query Parameter.Value --output text --region ${{ env.AWS_REGION }}); printf '%s' \"\$ENV_JSON\" | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(k+chr(61)+str(v)) for k,v in d.items()]' > /opt/api.env.next; test -s /opt/api.env.next; mv /opt/api.env.next /opt/api.env; aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${ECR_HOST}; docker pull ${ECR_IMAGE}; docker run --rm --env-file /opt/api.env --network container:academy-api ${ECR_IMAGE} python manage.py migrate --no-input 2>&1; EXIT=\$?; exit \$EXIT"

          # SSM commands 배열에 JSON-safe 형태로 전달
          SSM_PARAMS=$(jq -n --arg cmd "$MIGRATE_CMD" '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$SSM_PARAMS" \
            --timeout-seconds 300 \
            --region ${{ env.AWS_REGION }} \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete (최대 ~6분: docker pull + migrate 여유)
          for i in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }} \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i: status=$STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Migration completed successfully"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ${{ env.AWS_REGION }} \
                --query 'StandardOutputContent' \
                --output text
              echo "skipped=false" >> $GITHUB_OUTPUT
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "::error::Migration failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ${{ env.AWS_REGION }} \
                --query 'StandardOutputContent' \
                --output text
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ${{ env.AWS_REGION }} \
                --query 'StandardErrorContent' \
                --output text
              exit 1
            fi

            sleep 10
          done

          echo "::error::Migration timed out waiting for SSM command"
          exit 1

  # ============================================================
  # Phase 5: Selective ASG instance refresh (deploy)
  # ============================================================
  deploy-api:
    name: Deploy API (ASG refresh)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [detect-changes, build-and-push, verify-api-preprod, run-migrations]
    if: |
      always() &&
      needs.build-and-push.result == 'success' &&
      needs.verify-api-preprod.result == 'success' &&
      (needs.run-migrations.result == 'success' || needs.run-migrations.result == 'skipped') &&
      (needs.detect-changes.outputs.build_api == 'true' || needs.detect-changes.outputs.force_full == 'true')
    env:
      API_ASG_NAME: academy-v1-api-asg
      API_INSTANCE_WARMUP: "300"
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_FOR_ECR_BUILD }}
          aws-region: ${{ env.AWS_REGION }}
          action-timeout-s: 180

      - name: Pre-deploy health gate
        run: |
          echo "Verifying API is healthy before starting refresh..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 15 \
            "${{ env.API_PUBLIC_URL }}/healthz" || echo "000")
          echo "Pre-deploy healthz final status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::API is not healthy before deploy (healthz=$STATUS). Refusing production refresh."
            exit 1
          fi

      - name: Pin API Launch Template to build digest
        id: pin
        run: |
          python3 scripts/v1/deployment_lock.py renew --owner "$ACADEMY_DEPLOY_LOCK_OWNER" --ttl-seconds 10800
          pwsh ./scripts/v1/pin-asg-image.ps1 \
            -Service api \
            -ImageTag "${{ env.RELEASE_IMAGE_TAG }}" \
            -StatePath /tmp/api-pin-state.json \
            -Ci

      - name: Ensure API ASG launch-before-terminate ceiling
        id: refresh_capacity
        run: |
          CURRENT=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ${{ env.API_ASG_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'AutoScalingGroups[0].{Min:MinSize,Desired:DesiredCapacity,Max:MaxSize}' \
            --output json)
          CURRENT_MIN=$(echo "$CURRENT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Min"])')
          CURRENT_DESIRED=$(echo "$CURRENT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Desired"])')
          CURRENT_MAX=$(echo "$CURRENT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Max"])')
          echo "original_max=$CURRENT_MAX" >> "$GITHUB_OUTPUT"
          echo "changed=false" >> "$GITHUB_OUTPUT"

          # MinHealthy=100/MaxHealthy=200 makes Instance Refresh launch a new
          # target before terminating an old one. Preserve min/desired and only
          # raise the ceiling when a burst already has desired capacity at max.
          REQUIRED_MAX=$((CURRENT_DESIRED + 1))
          if [ "$CURRENT_MAX" -lt "$REQUIRED_MAX" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Temporarily raising API ASG max for one launch-before-terminate slot: min=$CURRENT_MIN desired=$CURRENT_DESIRED max=$CURRENT_MAX->$REQUIRED_MAX"
            aws autoscaling update-auto-scaling-group \
              --auto-scaling-group-name ${{ env.API_ASG_NAME }} \
              --region ${{ env.AWS_REGION }} \
              --max-size "$REQUIRED_MAX"
            READBACK_MAX=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names ${{ env.API_ASG_NAME }} \
              --region ${{ env.AWS_REGION }} \
              --query 'AutoScalingGroups[0].MaxSize' \
              --output text)
            if [ "$READBACK_MAX" -ne "$REQUIRED_MAX" ]; then
              echo "::error::API ASG max-size readback mismatch: expected=$REQUIRED_MAX actual=$READBACK_MAX"
              exit 1
            fi
          else
            echo "API ASG already has a replacement slot: min=$CURRENT_MIN desired=$CURRENT_DESIRED max=$CURRENT_MAX"
          fi

      - name: Start API ASG instance refresh
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ env.API_ASG_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --preferences "{\"MinHealthyPercentage\":100,\"MaxHealthyPercentage\":200,\"InstanceWarmup\":${API_INSTANCE_WARMUP},\"SkipMatching\":false}" \
            --query 'InstanceRefreshId' \
            --output text)
          echo "refresh_id=$REFRESH_ID" >> $GITHUB_OUTPUT
          echo "API ASG instance refresh started: $REFRESH_ID"

      - name: Wait for API refresh to complete
        id: wait_refresh
        run: |
          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"
          for i in $(seq 1 30); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ env.API_ASG_NAME }} \
              --instance-refresh-ids "$REFRESH_ID" \
              --region ${{ env.AWS_REGION }} \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Attempt $i/30: API refresh status=$STATUS"

            if [ "$STATUS" = "Successful" ]; then
              echo "API ASG refresh completed successfully"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "RollbackFailed" ] || [ "$STATUS" = "RollbackSuccessful" ]; then
              echo "::error::API ASG refresh $STATUS"
              exit 1
            fi
            sleep 30
          done
          echo "::error::API ASG refresh timed out after 15 minutes"
          exit 1

      - name: Restore API ASG max-size ceiling
        if: always() && steps.refresh_capacity.outputs.changed == 'true'
        run: |
          ORIGINAL_MAX="${{ steps.refresh_capacity.outputs.original_max }}"
          if ! [[ "$ORIGINAL_MAX" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid original API ASG max-size: $ORIGINAL_MAX"
            exit 1
          fi
          aws autoscaling update-auto-scaling-group \
            --auto-scaling-group-name ${{ env.API_ASG_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --max-size "$ORIGINAL_MAX"
          READBACK_MAX=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ${{ env.API_ASG_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'AutoScalingGroups[0].MaxSize' \
            --output text)
          if [ "$READBACK_MAX" -ne "$ORIGINAL_MAX" ]; then
            echo "::error::API ASG max-size restore failed: expected=$ORIGINAL_MAX actual=$READBACK_MAX"
            exit 1
          fi
          echo "API ASG max-size restored to $ORIGINAL_MAX"

      - name: Verify API runtime digest
        run: pwsh ./scripts/v1/pin-asg-image.ps1 -Service api -VerifyStatePath /tmp/api-pin-state.json -Ci

      - name: Compensate failed API pin or refresh
        if: failure() && steps.pin.outcome != 'skipped'
        run: |
          if [ ! -f /tmp/api-pin-state.json ]; then
            echo "No API pin state was persisted; no runtime mutation requires compensation."
            exit 0
          fi
          pwsh ./scripts/v1/pin-asg-image.ps1 -Service api -RestoreStatePath /tmp/api-pin-state.json -RefreshAndVerify -Ci

  deploy-messaging:
    name: Deploy Messaging Worker (ASG refresh)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [detect-changes, build-and-push, verify-api-preprod, run-migrations]
    if: |
      always() &&
      needs.build-and-push.result == 'success' &&
      needs.verify-api-preprod.result == 'success' &&
      (needs.run-migrations.result == 'success' || needs.run-migrations.result == 'skipped') &&
      (needs.detect-changes.outputs.build_messaging == 'true' || needs.detect-changes.outputs.force_full == 'true')
    env:
      MESSAGING_ASG_NAME: academy-v1-messaging-worker-asg
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_FOR_ECR_BUILD }}
          aws-region: ${{ env.AWS_REGION }}
          action-timeout-s: 180

      - name: Pin Messaging Launch Template to build digest
        id: pin
        run: |
          python3 scripts/v1/deployment_lock.py renew --owner "$ACADEMY_DEPLOY_LOCK_OWNER" --ttl-seconds 10800
          pwsh ./scripts/v1/pin-asg-image.ps1 \
            -Service messaging \
            -ImageTag "${{ env.RELEASE_IMAGE_TAG }}" \
            -StatePath /tmp/messaging-pin-state.json \
            -Ci

      - name: Remove scale-in protection before refresh
        run: |
          INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ${{ env.MESSAGING_ASG_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'AutoScalingGroups[0].Instances[?ProtectedFromScaleIn==`true`].InstanceId' \
            --output text)
          if [ -n "$INSTANCES" ] && [ "$INSTANCES" != "None" ]; then
            echo "Removing scale-in protection from: $INSTANCES"
            aws autoscaling set-instance-protection \
              --auto-scaling-group-name ${{ env.MESSAGING_ASG_NAME }} \
              --instance-ids $INSTANCES \
              --no-protected-from-scale-in \
              --region ${{ env.AWS_REGION }}
          else
            echo "No protected instances found"
          fi

      - name: Start Messaging ASG instance refresh
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ env.MESSAGING_ASG_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":200,"InstanceWarmup":120}' \
            --query 'InstanceRefreshId' \
            --output text)
          echo "refresh_id=$REFRESH_ID" >> $GITHUB_OUTPUT
          echo "Messaging ASG instance refresh started: $REFRESH_ID"

      - name: Wait for Messaging refresh to complete
        run: |
          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"
          for i in $(seq 1 40); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ env.MESSAGING_ASG_NAME }} \
              --instance-refresh-ids "$REFRESH_ID" \
              --region ${{ env.AWS_REGION }} \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Attempt $i/40: Messaging refresh status=$STATUS"

            if [ "$STATUS" = "Successful" ]; then
              echo "Messaging ASG refresh completed successfully"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "RollbackFailed" ] || [ "$STATUS" = "RollbackSuccessful" ]; then
              echo "::error::Messaging ASG refresh $STATUS"
              exit 1
            fi
            sleep 30
          done
          echo "::error::Messaging ASG refresh timed out after 20 minutes"
          exit 1

      - name: Verify Messaging runtime digest
        run: pwsh ./scripts/v1/pin-asg-image.ps1 -Service messaging -VerifyStatePath /tmp/messaging-pin-state.json -Ci

      - name: Compensate failed Messaging pin or refresh
        if: failure() && steps.pin.outcome != 'skipped'
        run: |
          if [ ! -f /tmp/messaging-pin-state.json ]; then
            echo "No Messaging pin state was persisted; no runtime mutation requires compensation."
            exit 0
          fi
          pwsh ./scripts/v1/pin-asg-image.ps1 -Service messaging -RestoreStatePath /tmp/messaging-pin-state.json -RefreshAndVerify -Ci

  deploy-ai:
    name: Deploy AI Worker (ASG refresh)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [detect-changes, build-and-push, verify-api-preprod, run-migrations]
    if: |
      always() &&
      needs.build-and-push.result == 'success' &&
      needs.verify-api-preprod.result == 'success' &&
      (needs.run-migrations.result == 'success' || needs.run-migrations.result == 'skipped') &&
      (needs.detect-changes.outputs.build_ai == 'true' || needs.detect-changes.outputs.force_full == 'true')
    env:
      AI_ASG_NAME: academy-v1-ai-worker-asg
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_FOR_ECR_BUILD }}
          aws-region: ${{ env.AWS_REGION }}
          action-timeout-s: 180

      - name: Converge AI warm baseline
        run: pwsh ./scripts/v1/converge-worker-warm-baseline.ps1 -Service ai -Ci

      - name: Pin AI Launch Template to build digest
        id: pin
        run: |
          python3 scripts/v1/deployment_lock.py renew --owner "$ACADEMY_DEPLOY_LOCK_OWNER" --ttl-seconds 10800
          pwsh ./scripts/v1/pin-asg-image.ps1 \
            -Service ai \
            -ImageTag "${{ env.RELEASE_IMAGE_TAG }}" \
            -StatePath /tmp/ai-pin-state.json \
            -Ci

      - name: Remove scale-in protection before refresh
        run: |
          INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ${{ env.AI_ASG_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'AutoScalingGroups[0].Instances[?ProtectedFromScaleIn==`true`].InstanceId' \
            --output text)
          if [ -n "$INSTANCES" ] && [ "$INSTANCES" != "None" ]; then
            echo "Removing scale-in protection from: $INSTANCES"
            aws autoscaling set-instance-protection \
              --auto-scaling-group-name ${{ env.AI_ASG_NAME }} \
              --instance-ids $INSTANCES \
              --no-protected-from-scale-in \
              --region ${{ env.AWS_REGION }}
          else
            echo "No protected instances found"
          fi

      - name: Verify AI ASG warm capacity
        run: |
          DESIRED=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ${{ env.AI_ASG_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'AutoScalingGroups[0].DesiredCapacity' \
            --output text)
          if ! [[ "$DESIRED" =~ ^[0-9]+$ ]] || [ "$DESIRED" -lt 1 ]; then
            echo "::error::AI warm baseline missing after convergence: desired=$DESIRED"
            exit 1
          fi
          echo "AI warm baseline ready for refresh: desired=$DESIRED"

      - name: Start AI ASG instance refresh
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ env.AI_ASG_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":200,"InstanceWarmup":120}' \
            --query 'InstanceRefreshId' \
            --output text)
          echo "refresh_id=$REFRESH_ID" >> $GITHUB_OUTPUT
          echo "AI ASG instance refresh started: $REFRESH_ID"

      - name: Wait for AI refresh to complete
        run: |
          REFRESH_ID="${{ steps.refresh.outputs.refresh_id }}"
          for i in $(seq 1 40); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${{ env.AI_ASG_NAME }} \
              --instance-refresh-ids "$REFRESH_ID" \
              --region ${{ env.AWS_REGION }} \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Attempt $i/40: AI refresh status=$STATUS"

            if [ "$STATUS" = "Successful" ]; then
              echo "AI ASG refresh completed successfully"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "RollbackFailed" ] || [ "$STATUS" = "RollbackSuccessful" ]; then
              echo "::error::AI ASG refresh $STATUS"
              exit 1
            fi
            sleep 30
          done
          echo "::error::AI ASG refresh timed out after 20 minutes"
          exit 1

      - name: Verify AI warm runtime digest
        run: pwsh ./scripts/v1/pin-asg-image.ps1 -Service ai -VerifyStatePath /tmp/ai-pin-state.json -Ci

      - name: Compensate failed AI pin or refresh
        if: failure() && steps.pin.outcome != 'skipped'
        run: |
          if [ ! -f /tmp/ai-pin-state.json ]; then
            echo "No AI pin state was persisted; no runtime mutation requires compensation."
            exit 0
          fi
          pwsh ./scripts/v1/pin-asg-image.ps1 -Service ai -RestoreStatePath /tmp/ai-pin-state.json -RefreshAndVerify -Ci

